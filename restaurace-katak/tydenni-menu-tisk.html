<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Týdenní menu k tisku · Restaurace Kaťák</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c8963e;
    --gold-dark: #a07724;
    --ink: #1a1212;
    --muted: #6a615a;
    --line: #e6dac3;
    --cream: #faf6ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #d6d2cc; }
  body {
    font-family: 'Poppins', sans-serif;
    color: var(--ink);
    padding: 30px 0;
    line-height: 1.45;
  }

  /* TOOLBAR – jen na obrazovce */
  .toolbar {
    max-width: 148mm;
    margin: 0 auto 20px;
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
  }
  .toolbar button, .toolbar a {
    background: #1a1a1a; color: #fff;
    border: none; padding: 12px 28px; cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-size: .8rem; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    text-decoration: none;
    transition: all .25s;
    border-radius: 4px;
  }
  .toolbar button:hover { background: var(--gold); color: #1a1a1a; }
  .toolbar a { background: transparent; color: #1a1a1a; border: 1px solid #1a1a1a; }
  .toolbar a:hover { background: #1a1a1a; color: #fff; }

  /* Stránka A5 */
  .page {
    width: 148mm;
    min-height: 210mm;
    margin: 0 auto;
    background: var(--cream);
    padding: 16mm 14mm;
    box-shadow: 0 8px 28px rgba(0,0,0,.18);
    position: relative;
    display: flex; flex-direction: column;
  }
  .page::before {
    content: '';
    position: absolute; inset: 6mm;
    border: 1.5px solid var(--gold);
    pointer-events: none;
  }

  .header {
    text-align: center;
    padding-bottom: 7mm;
    border-bottom: 1.5px solid var(--gold);
    margin-bottom: 6mm;
  }
  .header img.logo {
    max-width: 56mm; max-height: 24mm;
    margin: 0 auto 4mm; display: block;
  }
  .header .restaurant-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16pt; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink);
  }
  .header .subtitle {
    font-size: 8pt; color: var(--muted);
    margin-top: 2mm; letter-spacing: .12em; text-transform: uppercase;
  }

  .week-banner {
    text-align: center;
    margin-bottom: 5mm;
  }
  .week-banner .week-label {
    display: inline-block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14pt; font-weight: 600;
    color: var(--gold-dark);
    font-style: italic;
  }
  .week-banner .intro {
    font-size: 8pt; color: var(--muted);
    margin-top: 2mm; line-height: 1.5;
  }
  .week-banner .intro strong { color: var(--gold-dark); }

  .days {
    flex: 1;
    display: flex; flex-direction: column;
    gap: 3mm;
  }
  .day {
    padding: 3mm 4mm;
    background: rgba(255,255,255,.55);
    border-left: 2.5px solid var(--gold);
    page-break-inside: avoid;
  }
  .day-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 1.5mm;
  }
  .day-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12pt; font-weight: 700;
    color: var(--ink); letter-spacing: .02em;
  }
  .day-date {
    font-size: 7pt; color: var(--gold-dark);
    font-weight: 600; letter-spacing: .15em; text-transform: uppercase;
  }
  .soup {
    font-size: 8.5pt; color: var(--ink);
    margin-bottom: 1.5mm; font-style: italic;
  }
  .soup-label {
    font-style: normal; font-size: 6pt;
    color: var(--gold-dark); font-weight: 700;
    letter-spacing: .15em; text-transform: uppercase;
    margin-right: 1.5mm;
  }
  .mains {
    list-style: none; padding: 0; margin: 0;
  }
  .mains li {
    font-size: 9pt; line-height: 1.4;
    padding: 1mm 0;
    border-top: 1px dotted rgba(160,119,36,.3);
  }
  .mains li:first-child { border-top: none; }
  .mains li::before {
    content: '·'; color: var(--gold);
    font-weight: 700; margin-right: 2mm;
  }

  .footer {
    margin-top: 5mm;
    padding-top: 4mm;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 7pt; color: var(--muted);
    line-height: 1.5;
  }
  .footer strong { color: var(--ink); }
  .footer .contact-line { margin-top: 1mm; }

  .empty {
    padding: 20mm 5mm; text-align: center;
    font-style: italic; color: var(--muted); font-size: 10pt;
  }

  /* PRINT */
  @page {
    size: A5 portrait;
    margin: 0;
  }
  @media print {
    html, body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .page {
      width: 148mm; min-height: 210mm;
      margin: 0; padding: 13mm 11mm;
      box-shadow: none;
    }
    .page::before { inset: 4mm; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">🖨️ Vytisknout / Uložit jako PDF</button>
  <a href="index.html#weekly">← Zpět na web</a>
</div>

<div class="page">
  <div class="header">
    <img class="logo" id="logo" src="photos-real/logo.png" alt="Restaurace Kaťák" onerror="this.style.display='none'">
    <div class="restaurant-name">Restaurace Kaťák</div>
    <div class="subtitle">Troubsko · Školní 7/12</div>
  </div>

  <div class="week-banner">
    <div class="week-label" id="week-label">Týdenní menu</div>
    <div class="intro" id="intro"></div>
  </div>

  <div class="days" id="days"></div>

  <div class="footer">
    <strong>Restaurace Kaťák</strong> · Školní 7/12, 664 41 Troubsko
    <div class="contact-line">+420 607 083 737 · restaurantkatak@gmail.com · katakrestaurace.cz</div>
  </div>
</div>

<script>
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

fetch('data.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => {
    const wk = data.weeklyMenu || {};
    document.getElementById('week-label').textContent = wk.weekLabel || 'Týdenní menu';
    const introEl = document.getElementById('intro');
    const parts = [];
    if (wk.intro) parts.push(escapeHtml(wk.intro));
    if (wk.price) parts.push(`Cena <strong>${escapeHtml(wk.price)}</strong>`);
    introEl.innerHTML = parts.join(' · ');

    const daysEl = document.getElementById('days');
    if (!Array.isArray(wk.days) || wk.days.length === 0) {
      daysEl.innerHTML = '<div class="empty">Týdenní menu se připravuje.</div>';
      return;
    }
    daysEl.innerHTML = wk.days.map(d => `
      <div class="day">
        <div class="day-head">
          <span class="day-name">${escapeHtml(d.day)}</span>
          ${d.date ? `<span class="day-date">${escapeHtml(d.date)}</span>` : ''}
        </div>
        ${d.soup ? `<div class="soup"><span class="soup-label">Polévka</span>${escapeHtml(d.soup)}</div>` : ''}
        <ul class="mains">
          ${(d.mains || []).map(m => `<li>${escapeHtml(m)}</li>`).join('')}
        </ul>
      </div>
    `).join('');

    // Spustit print dialog automaticky po načtení (jen pokud jsme nepřišli z linku)
    // - Vypnuto, aby uživatel měl kontrolu. Tlačítko nahoře.
  })
  .catch(err => {
    document.getElementById('days').innerHTML = '<div class="empty">Chyba při načítání menu.</div>';
    console.error(err);
  });
</script>

</body>
</html>
